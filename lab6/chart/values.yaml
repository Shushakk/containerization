api:
  replicaCount: 3
  image:
    repository: shop.local/api
    tag: v5
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
    externalTrafficPolicy: Local
  appVersion: v1
  fail: "false"
  flaky: "false"
  healthFail: "false"
  linkerd:
    enabled: false
  retries:
    enabled: false
    http: "5xx"
    limit: "2"
  priorityClassName: shop-critical
  topologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  pdb:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

canary:
  enabled: false
  replicaCount: 1
  image:
    repository: shop.local/api
    tag: v2
    pullPolicy: IfNotPresent
  clientImage:
    repository: shop.local/api
    tag: v1
    pullPolicy: IfNotPresent
  fail: "false"
  flaky: "false"
  healthFail: "false"
  stableWeight: 90
  canaryWeight: 10

worker:
  replicaCount: 2
  image:
    repository: shop.local/worker
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8081
  pollInterval: "3"
  dbRetryInterval: "5"
  resources:
    requests:
      cpu: "10m"
      memory: "100Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"

postgres:
  enabled: true
  clusterName: shop-db
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  priorityClassName: shop-critical
  database: shop
  secretName: shop-db-credentials
  username: shop
  password: "ShopLab3-ChangeMe-2026!"
  storageSize: 1Gi
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1Gi"

priorityClasses:
  create: true
  critical:
    name: shop-critical
    value: 100000
  batch:
    name: shop-batch-low
    value: -10

monitoring:
  dashboard:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: true
    labels: {}

batch:
  replicaCount: 1
  priorityClassName: shop-batch-low
  image:
    repository: shop.local/batch
    tag: v1
    pullPolicy: IfNotPresent
  memoryMB: 64
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Сетевые ограничения для Zero Trust
networkPolicy:
  enabled: true
  nodeSubnet: 172.19.0.0/16
  faultMode: none
  ports:
    api: 8000
    postgres: 5432
    dns: 53
    cnpgMetrics: 8000
  selectors:
    appPartOf: shop
    postgresInstance: shop-db
    postgresName: postgresql
    dnsNamespace: kube-system
    dnsLabelKey: k8s-app
    dnsLabelValue: kube-dns
    cnpgNamespace: cnpg-system
    cnpgOperatorName: cloudnative-pg
