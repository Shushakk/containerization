controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Ищем Pod'ы на той Kubernetes-нode,
      // где запущен данный Alloy.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // Из найденных Pod'ов оставляем только наш api.
      discovery.relabel "api_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "keep"
          regex         = "default"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          action        = "keep"
          regex         = "api"
        }
      }

      // Читаем логи контейнеров api.
      loki.source.kubernetes "pods" {
        targets = discovery.relabel.api_pods.output

        forward_to = [
          loki.process.pods.receiver,
        ]
      }

      // Обработка логов перед отправкой.
      loki.process "pods" {
        stage.static_labels {
          values = {
            cluster = "minikube",
          }
        }

        forward_to = [
          loki.write.default.receiver,
        ]
      }

      // Отправка логов в Loki.
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }