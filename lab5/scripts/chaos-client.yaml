apiVersion: v1
kind: Pod
metadata:
  name: shop-chaos-client
  namespace: shop
  labels:
    app.kubernetes.io/instance: shop
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: shop
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: shop.local/api:v5
      imagePullPolicy: IfNotPresent
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          url = "http://shop-api.shop.svc.cluster.local.:8000/health"

          print("timestamp,status,latency_ms,error", flush=True)
          next_tick = time.monotonic()

          while True:
              started = time.monotonic()
              timestamp = datetime.now(timezone.utc).isoformat()
              status = 0
              error = "-"

              try:
                  req = Request(url, headers={"User-Agent": "shop-chaos-client"})
                  with urlopen(req, timeout=3) as response:
                      status = response.status
              except HTTPError as exc:
                  status = exc.code
                  error = "http_error"
              except URLError:
                  error = "url_error"
              except Exception as exc:
                  error = type(exc).__name__

              latency_ms = (time.monotonic() - started) * 1000
              print(
                  f"{timestamp},{status},{latency_ms:.2f},{error}",
                  flush=True
              )

              next_tick += 1.0
              time.sleep(max(0, next_tick - time.monotonic()))
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
