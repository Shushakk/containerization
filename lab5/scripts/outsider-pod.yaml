apiVersion: v1
kind: Pod
metadata:
  name: shop-outsider
  namespace: shop
  labels:
    app.kubernetes.io/name: outsider
    app.kubernetes.io/instance: shop
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: network-test
    app.kubernetes.io/managed-by: kubectl
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: tester
      image: shop.local/api:v5
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - "import time; time.sleep(3600)"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
