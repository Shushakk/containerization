{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-nodeport-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: {{ .Values.networkPolicy.selectors.appPartOf }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.nodeSubnet | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ports.api }}
{{- end }}
