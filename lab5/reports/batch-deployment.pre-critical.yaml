apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-batch
  labels:
    app.kubernetes.io/name: batch
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.batch.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: batch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          env:
            - name: BATCH_MEMORY_MB
              value: {{ .Values.batch.memoryMB | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
