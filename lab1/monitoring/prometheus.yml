global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /prometheus/shop-alerts.yml

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets:
          - lab-cadvisor:8080

  - job_name: shop-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.18.0.1:18000
