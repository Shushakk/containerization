apiVersion: v1
kind: Pod
metadata:
  name: test-untrusted-image
  namespace: default
  labels:
    app.kubernetes.io/name: test
    app.kubernetes.io/part-of: shop-lab3
spec:
  containers:
    - name: test
      image: docker.io/library/nginx:1.27
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
