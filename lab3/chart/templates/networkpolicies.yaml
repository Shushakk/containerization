    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: api-v2
              app.kubernetes.io/part-of: {{ .Values.networkPolicy.selectors.appPartOf }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ports.postgres }}

---
# Meshed-клиент может обращаться к proxy обеих версий API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-client-to-api-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: client
      app.kubernetes.io/part-of: {{ .Values.networkPolicy.selectors.appPartOf }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/part-of: {{ .Values.networkPolicy.selectors.appPartOf }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api
                  - api-v2
      ports:
        - protocol: TCP
          port: 4143
{{- end }}


