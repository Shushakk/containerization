apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{ if .Values.api.retries.enabled }}
  annotations:
    retry.linkerd.io/http: {{ .Values.api.retries.http | quote }}
    retry.linkerd.io/limit: {{ .Values.api.retries.limit | quote }}
  {{ end }}
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
{{ if or (eq (.Values.api.service.type | default "ClusterIP") "NodePort") (eq (.Values.api.service.type | default "ClusterIP") "LoadBalancer") }}
  externalTrafficPolicy: {{ .Values.api.service.externalTrafficPolicy | default "Cluster" }}
{{ end }}
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      {{ if eq (.Values.api.service.type | default "ClusterIP") "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{ end }}
